[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "silica-eda"
version = "0.1.2"
description = "AI-native EDA environment — MCP server for hardware design and verification"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Christopher Simaan", email = "dev@getsilica.dev" }]
keywords = ["eda", "rtl", "fpga", "mcp", "ai", "hardware", "verilog", "systemverilog"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.9.0,<2.0.0",
    "tomli-w>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
silica = "silica.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["silica"]
artifacts = ["silica/skills/**/*.md"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
