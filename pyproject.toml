[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "silica-eda"
version = "0.4.0"
description = "AI-native EDA environment — MCP server for hardware design and verification"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Christopher Simaan", email = "dev@getsilica.dev" }]
keywords = ["eda", "rtl", "fpga", "mcp", "ai", "hardware", "verilog", "systemverilog"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "mcp>=2.3.0,<3.0.0",
    "tomli-w>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
# run_cocotb drives cocotb's runner API, which needs cocotb >= 1.9.
cocotb = ["cocotb>=1.9"]
# capture_serial reads a board's UART through pyserial.
serial = ["pyserial>=3.5"]

[project.urls]
Homepage = "https://github.com/simaanc/silica-eda"
Repository = "https://github.com/simaanc/silica-eda"
Issues = "https://github.com/simaanc/silica-eda/issues"
Changelog = "https://github.com/simaanc/silica-eda/blob/main/CHANGELOG.md"

[project.scripts]
silica = "silica.cli:main"
# Same entry point under the package name, so `uvx silica-eda` starts the
# server (uvx runs the executable named after the package).
silica-eda = "silica.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["silica"]
artifacts = ["silica/skills/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires real EDA tool binaries on PATH or in OSS CAD Suite",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyserial>=3.5",
    "ruff>=0.4",
]
