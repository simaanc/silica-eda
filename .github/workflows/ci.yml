name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Windows leg protects the drive-letter regexes, MSYS workarounds,
        # and 8.3-path handling in the adapters from Linux-side regressions.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - run: uv sync

      - run: uv run ruff check silica/ tests/

      # Integration tests skip themselves when the real EDA binaries are
      # absent, so this exercises the full mock-based unit suite.
      - run: uv run pytest tests/ -q
