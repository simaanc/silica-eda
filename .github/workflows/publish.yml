name: Publish to PyPI

# Releases need no manual step. Every push to main that changes the package
# (silica/, pyproject.toml, uv.lock, plugin/ or server.json) since the latest
# vX.Y.Z tag releases the next patch version. A push that changes only CI,
# tests or docs releases nothing. To start a new minor or major series, run
# this workflow by hand (Actions -> Publish to PyPI -> Run workflow) and pick
# "minor" or "major"; patches then continue from it. Pushing a vX.Y.Z tag by
# hand releases that tag's commit.
# The version is never committed: the build takes it from
# SETUPTOOLS_SCM_PRETEND_VERSION, the tag job tags the commit once PyPI has
# the release, the registry job stamps server.json, and the GitHub release
# notes are generated from the merged PRs. See RELEASING.md.
# The workflow filename and the "pypi" environment are what PyPI's trusted
# publisher for silica-eda is registered against, so keep both.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

# One release at a time, so two quick merges can't claim the same version.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.prepare.outputs.release }}
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      # Full history and tags, to find the latest release and diff against it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide what to release
        id: prepare
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          LATEST=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n 1)
          RELEASE=true
          if [ "$EVENT" = push ] && [ "${REF#refs/tags/}" != "$REF" ]; then
            VERSION=${REF#refs/tags/v}
          else
            IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
            case "$BUMP" in
              major) VERSION="$((MAJOR + 1)).0.0" ;;
              minor) VERSION="$MAJOR.$((MINOR + 1)).0" ;;
              *)     VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
            esac
            if [ "$EVENT" = push ]; then
              CHANGED=$(git diff --name-only "$LATEST" HEAD -- \
                silica pyproject.toml uv.lock plugin server.json)
              if [ -z "$CHANGED" ]; then
                echo "::notice::nothing in the package changed since $LATEST; not releasing"
                RELEASE=false
              else
                echo "Changed since $LATEST:"
                echo "$CHANGED"
              fi
            fi
          fi
          if [ "$RELEASE" = true ] && git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null \
             && [ "$(git rev-list -n 1 "v$VERSION")" != "$GITHUB_SHA" ]; then
            echo "::error::v$VERSION already tags another commit"
            exit 1
          fi
          if [ "$RELEASE" = true ]; then
            echo "::notice::releasing $VERSION (latest was ${LATEST:-none})"
          fi
          {
            echo "release=$RELEASE"
            echo "version=$VERSION"
            echo "tag=v$VERSION"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.prepare.outputs.version }}
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache: the release build must not restore anything another
      # workflow could have written.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - run: uv build --no-sources

      # Start the built wheel in a clean environment and compare it with the
      # tagged source over MCP before anything is uploaded.
      - name: Smoke-test the wheel
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          uv sync
          uv run python scripts/check_release.py --version "$VERSION" \
            --server "uv run --isolated --no-project --with dist/silica_eda-$VERSION-py3-none-any.whl silica-eda" \
            --expect-from "uv run silica serve"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      # --check-url skips files already on PyPI, so a re-run after a partial
      # upload finishes the job instead of failing.
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/silica-eda/

  # Tag the released commit as soon as PyPI has it, so the tag marks what was
  # published even if a later job fails. A tag created with the workflow's
  # token doesn't start this workflow again. On a tag push it already exists.
  tag:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Tag the release commit
        run: |
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" > /dev/null 2>&1; then
            echo "::notice::$TAG already exists"
          else
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null
            echo "::notice::tagged $GITHUB_SHA as $TAG"
          fi

  # Install what PyPI now serves, the way users do, and check it: the server
  # starts, reports the tag's version, serves the same tools as the tagged
  # source, and its doctor tool runs (once there is one).
  verify:
    needs: [build, publish]
    runs-on: ubuntu-latest
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Check the published release with uvx
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          uv sync
          uv run python scripts/check_release.py --version "$VERSION" \
            --server "uvx --refresh silica-eda==$VERSION" \
            --expect-from "uv run silica serve" \
            --retries 10 --retry-delay 30

  # Publish server.json to the official MCP registry once PyPI serves the
  # release: the registry checks the PyPI package, and the mcp-name line in
  # its description, before it accepts the entry. GitHub OIDC proves that the
  # workflow belongs to simaanc, which owns the io.github.simaanc/ namespace,
  # so there is no stored token. See RELEASING.md.
  registry:
    needs: [build, verify]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
      # Pinned with its checksum from the release's registry_<ver>_checksums.txt.
      # Bump it when the registry rejects logins with "invalid audience".
      MCP_PUBLISHER_VERSION: 1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # server.json in the repository holds a placeholder version; publish
      # it with the release's.
      - name: Stamp server.json with the release version
        run: |
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.json.new
          mv server.json.new server.json

      - name: Install mcp-publisher
        run: |
          curl -sSfLo mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      # Registry versions are immutable and a duplicate publish is an error,
      # so a re-run after a successful publish skips instead of failing.
      - name: Check whether this version is already in the registry
        id: existing
        run: |
          NAME=$(jq -r .name server.json)
          URL="https://registry.modelcontextprotocol.io/v0.1/servers/${NAME/\//%2F}/versions/$VERSION"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL")
          case "$code" in
            200) echo "::notice::$NAME $VERSION is already in the registry; skipping publish"
                 echo "published=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *)   echo "::error::registry lookup returned HTTP $code"; exit 1 ;;
          esac

      - name: Publish to the MCP registry
        if: steps.existing.outputs.published == 'false'
        run: |
          ./mcp-publisher validate
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: Check the registry serves the release
        env:
          URL: ${{ steps.existing.outputs.url }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -sf "$URL" | jq -e --arg v "$VERSION" '.server.version == $v' > /dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::the registry does not list version $VERSION at $URL"
          exit 1

  # Create the GitHub release for the tag once the PyPI release is verified,
  # with notes generated from the PRs merged since the previous release and
  # the built sdist and wheel attached. A re-run after the release exists only replaces the
  # attached files.
  github-release:
    needs: [prepare, build, verify, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Create the GitHub release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::release $TAG already exists; replacing its files"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag \
              --title "silica-eda $VERSION" --generate-notes
          fi
