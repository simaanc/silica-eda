name: Publish to PyPI

# Releases are cut by pushing a vMAJOR.MINOR.PATCH tag on main after the
# release PR (from scripts/bump_version.py) has merged; see RELEASING.md.
# After PyPI, the registry job publishes server.json to the MCP registry.
# The workflow filename and the "pypi" environment are what PyPI's trusted
# publisher for silica-eda is registered against, so keep both.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache: the release build must not restore anything another
      # workflow could have written.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Check the tag matches pyproject.toml
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(grep -Po '(?<=^version = ")[^"]*' pyproject.toml)
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match pyproject.toml version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The GitHub release job uses this section as the release body; check
      # it exists before anything is uploaded.
      - name: Check CHANGELOG.md has notes for the tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/release_notes.py "$VERSION" > /dev/null

      - run: uv build --no-sources

      # Start the built wheel in a clean environment and compare it with the
      # tagged source over MCP before anything is uploaded.
      - name: Smoke-test the wheel
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv sync
          uv run python scripts/check_release.py --version "$VERSION" \
            --server "uv run --isolated --no-project --with dist/silica_eda-$VERSION-py3-none-any.whl silica-eda" \
            --expect-from "uv run silica serve"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      # --check-url skips files already on PyPI, so a re-run after a partial
      # upload finishes the job instead of failing.
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/silica-eda/

  # Install what PyPI now serves, the way users do, and check it: the server
  # starts, reports the tag's version, serves the same tools as the tagged
  # source, and its doctor tool runs (once there is one).
  verify:
    needs: [build, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Check the published release with uvx
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          uv sync
          uv run python scripts/check_release.py --version "$VERSION" \
            --server "uvx --refresh silica-eda==$VERSION" \
            --expect-from "uv run silica serve" \
            --retries 10 --retry-delay 30

  # Publish server.json to the official MCP registry once PyPI serves the
  # release: the registry checks the PyPI package, and the mcp-name line in
  # its description, before it accepts the entry. GitHub OIDC proves that the
  # workflow belongs to simaanc, which owns the io.github.simaanc/ namespace,
  # so there is no stored token. See RELEASING.md.
  registry:
    needs: [build, verify]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
      # Pinned with its checksum from the release's registry_<ver>_checksums.txt.
      # Bump it when the registry rejects logins with "invalid audience".
      MCP_PUBLISHER_VERSION: 1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check server.json matches the tag
        run: |
          for v in "$(jq -r .version server.json)" "$(jq -r '.packages[0].version' server.json)"; do
            if [ "$v" != "$VERSION" ]; then
              echo "::error::server.json names version $v, but the tag is v$VERSION"
              exit 1
            fi
          done

      - name: Install mcp-publisher
        run: |
          curl -sSfLo mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      # Registry versions are immutable and a duplicate publish is an error,
      # so a re-run after a successful publish skips instead of failing.
      - name: Check whether this version is already in the registry
        id: existing
        run: |
          NAME=$(jq -r .name server.json)
          URL="https://registry.modelcontextprotocol.io/v0.1/servers/${NAME/\//%2F}/versions/$VERSION"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL")
          case "$code" in
            200) echo "::notice::$NAME $VERSION is already in the registry; skipping publish"
                 echo "published=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *)   echo "::error::registry lookup returned HTTP $code"; exit 1 ;;
          esac

      - name: Publish to the MCP registry
        if: steps.existing.outputs.published == 'false'
        run: |
          ./mcp-publisher validate
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: Check the registry serves the release
        env:
          URL: ${{ steps.existing.outputs.url }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -sf "$URL" | jq -e --arg v "$VERSION" '.server.version == $v' > /dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::the registry does not list version $VERSION at $URL"
          exit 1

  # Create the GitHub release for the tag once the PyPI release is verified,
  # with the version's CHANGELOG.md section as its notes and the built sdist
  # and wheel attached. A re-run after the release exists only replaces the
  # attached files.
  github-release:
    needs: [build, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Create the GitHub release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::release $TAG already exists; replacing its files"
            gh release upload "$TAG" dist/* --clobber
          else
            python3 scripts/release_notes.py "$VERSION" > notes.md
            gh release create "$TAG" dist/* --verify-tag \
              --title "silica-eda $VERSION" --notes-file notes.md
          fi
