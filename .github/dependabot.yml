version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    ignore:
      # mcp majors change server APIs (1 -> 2 renamed FastMCP to MCPServer);
      # moving to the next one is a migration, not a routine bump.
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]
    groups:
      python:
        patterns: ["*"]
