version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    ignore:
      # mcp 2.x renames FastMCP to MCPServer and changes other server APIs;
      # moving to it is a migration, not a routine bump.
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]
    groups:
      python:
        patterns: ["*"]
